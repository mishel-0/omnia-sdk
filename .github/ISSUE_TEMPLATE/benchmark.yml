name: Benchmark result
description: Share numbers from your hardware (faster or slower)
labels: [benchmark]
body:
  - type: input
    id: hardware
    attributes: {label: Hardware, placeholder: "GPU, CPU cores, disk (NVMe / network)"}
    validations: {required: true}
  - type: input
    id: format
    attributes: {label: File format(s)}
    validations: {required: true}
  - type: textarea
    id: results
    attributes: {label: Output of `omnia benchmark formats` (JSON or table), render: json}
    validations: {required: true}
