<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Terminal: install, convert, verify, train">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;white-space:pre}
@keyframes type{0%{width:0}12%,92%{width:var(--w)}100%{width:0}}
@keyframes pop{0%{width:0}1%,92%{width:900px}100%{width:0}}
rect[class^=l]{width:0}
.l0{animation:type 11s 0.0s steps(86,end) infinite;--w:830px}.l1{animation:type 11s 1.6s steps(28,end) infinite;--w:270px}.l2{animation:pop 11s 3.0s steps(1,end) infinite;--w:540px}.l3{animation:type 11s 4.0s steps(26,end) infinite;--w:251px}.l4{animation:pop 11s 5.2s steps(1,end) infinite;--w:444px}.l5{animation:type 11s 6.2s steps(48,end) infinite;--w:463px}.l6{animation:pop 11s 7.6s steps(1,end) infinite;--w:511px}
@media (prefers-reduced-motion: reduce){rect[class^=l]{animation:none!important;width:900px}}
</style>
<rect width="960" height="330" rx="12" fill="#0d1117"/>
<rect width="960" height="36" rx="12" fill="#161b26"/><rect y="24" width="960" height="12" fill="#161b26"/>
<circle cx="24" cy="18" r="6" fill="#ff5f57"/><circle cx="44" cy="18" r="6" fill="#febc2e"/><circle cx="64" cy="18" r="6" fill="#28c840"/>
<text x="480.0" y="23" text-anchor="middle" fill="#8b90a8" style="font-size:13px">omnia</text>
<clipPath id="c0"><rect class="l0" x="34" y="64" height="26"/></clipPath><text x="34" y="82" clip-path="url(#c0)" fill="#e8e9f2"><tspan fill="#a48cf0">$ </tspan>curl -fsSL https://raw.githubusercontent.com/mishel-0/omnia-sdk/main/install.sh | sh</text><clipPath id="c1"><rect class="l1" x="34" y="98" height="26"/></clipPath><text x="34" y="116" clip-path="url(#c1)" fill="#e8e9f2"><tspan fill="#a48cf0">$ </tspan>omnia convert brain.nii.gz</text><clipPath id="c2"><rect class="l2" x="34" y="132" height="26"/></clipPath><text x="34" y="150" clip-path="url(#c2)" fill="#8fd6a8"><tspan fill="#a48cf0"></tspan>INFO: Converted brain.nii.gz (nifti): 18.2 MB -&gt; 17.9 MB</text><clipPath id="c3"><rect class="l3" x="34" y="166" height="26"/></clipPath><text x="34" y="184" clip-path="url(#c3)" fill="#e8e9f2"><tspan fill="#a48cf0">$ </tspan>omnia verify brain.omnia</text><clipPath id="c4"><rect class="l4" x="34" y="200" height="26"/></clipPath><text x="34" y="218" clip-path="url(#c4)" fill="#8fd6a8"><tspan fill="#a48cf0"></tspan>INFO: Verification passed: 160 tiles, 0 errors</text><clipPath id="c5"><rect class="l5" x="34" y="234" height="26"/></clipPath><text x="34" y="252" clip-path="url(#c5)" fill="#e8e9f2"><tspan fill="#a48cf0">$ </tspan>python train.py   # OmniaDataset -&gt; DataLoader</text><clipPath id="c6"><rect class="l6" x="34" y="268" height="26"/></clipPath><text x="34" y="286" clip-path="url(#c6)" fill="#8fd6a8"><tspan fill="#a48cf0"></tspan># on an A40 GPU: 1,032 -&gt; 2,024 slices/s, 2.0x faster</text>
</svg>
