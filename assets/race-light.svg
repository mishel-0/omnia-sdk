<rect class="bar" style="animation-delay:0.75s" x="330" y="340" width="254.4" height="10" rx="2" fill="#c9cbd8"/>
<rect class="bar" style="animation-delay:1.00s" x="330" y="354" width="469.7" height="10" rx="2" fill="#5b3fa8"/>
