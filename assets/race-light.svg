<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" role="img" aria-label="Training throughput, original file vs .omnia">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes grow{0%{transform:scaleX(0)}25%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes show{0%,20%{opacity:0}30%,86%{opacity:1}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 7s cubic-bezier(.3,.7,.2,1) infinite}
.lab{animation:show 7s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="960" height="434" fill="#ffffff"/>
<text x="40" y="34" font-size="18" font-weight="700" fill="#1b1d2a">Training throughput, same GPU, same loop</text>
<rect x="730" y="22" width="12" height="12" rx="2" fill="#c9cbd8"/><text x="748" y="33" font-size="13" fill="#6a6f85">original file</text>
<rect x="850" y="22" width="12" height="12" rx="2" fill="#5b3fa8"/><text x="868" y="33" font-size="13" fill="#6a6f85">.omnia</text>
<text x="314" y="85" text-anchor="end" font-size="14" fill="#1b1d2a">Aperio SVS · JPEG 2000</text>
<rect class="bar" style="animation-delay:0.00s" x="330" y="70" width="55.2" height="10" rx="2" fill="#c9cbd8"/>
<rect class="bar" style="animation-delay:0.25s" x="330" y="84" width="470.0" height="10" rx="2" fill="#5b3fa8"/>
<text class="lab" style="animation-delay:1.30s" x="820" y="91" font-size="20" font-weight="700" fill="#5b3fa8">8.5×</text><text x="314" y="139" text-anchor="end" font-size="14" fill="#1b1d2a">Aperio SVS · 20x</text>
<rect class="bar" style="animation-delay:0.15s" x="330" y="124" width="85.9" height="10" rx="2" fill="#c9cbd8"/>
<rect class="bar" style="animation-delay:0.40s" x="330" y="138" width="353.5" height="10" rx="2" fill="#5b3fa8"/>
<text class="lab" style="animation-delay:1.45s" x="820" y="145" font-size="20" font-weight="700" fill="#5b3fa8">4.1×</text><text x="314" y="193" text-anchor="end" font-size="14" fill="#1b1d2a">3DHISTECH MIRAX</text>
<rect class="bar" style="animation-delay:0.30s" x="330" y="178" width="104.8" height="10" rx="2" fill="#c9cbd8"/>
