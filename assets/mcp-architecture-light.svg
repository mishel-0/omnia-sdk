<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Omnia Model Context Protocol (MCP) Architecture">
<defs>
  <linearGradient id="grad-omnia" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5fc59a"/>
    <stop offset="100%" stop-color="#3aa97b"/>
  </linearGradient>
  <linearGradient id="grad-mcp" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c65f6"/>
    <stop offset="100%" stop-color="#a48cf0"/>
  </linearGradient>
  <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#161b22"/>
    <stop offset="100%" stop-color="#0f1319"/>
  </linearGradient>
</defs>

<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

@keyframes flow {
  0% { stroke-dashoffset: 40; }
  100% { stroke-dashoffset: 0; }
}

@keyframes packet-left {
  0% { transform: translateX(0); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(170px); opacity: 0; }
}

@keyframes packet-right {
  0% { transform: translateX(0); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(170px); opacity: 0; }
}

.wire-in {
  stroke-dasharray: 4 6;
  animation: flow 2s linear infinite;
}

.wire-out {
  stroke-dasharray: 4 6;
  animation: flow 2s linear infinite reverse;
}

.dot-l { animation: packet-left 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.dot-r { animation: packet-right 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>

<!-- Canvas Background -->
<rect width="960" height="410" fill="#0d1117"/>

<!-- Header -->
<g transform="translate(40, 36)">
  <rect x="0" y="0" width="46" height="20" rx="4" fill="#21262d"/>
  <text x="23" y="14" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#a48cf0">MCP</text>
  <text x="58" y="15" font-size="15" font-weight="700" fill="#f0f6fc">Model Context Protocol Server</text>
  <text x="58" y="32" font-size="12" fill="#8b949e">Any MCP client inspects .omnia pyramids, verifies CRC checksums, and accesses slides</text>
</g>

<!-- ================= AI CLIENTS (LEFT) ================= -->
<g transform="translate(40, 88)">

  <!-- Claude -->
  <g transform="translate(0, 0)">
    <rect width="180" height="58" rx="8" fill="url(#grad-card)" stroke="#30363d"/>
    <!-- Official Anthropic / Claude Logo -->
    <g transform="translate(14, 16) scale(1.1)" fill="#d97757">
      <path fill-rule="evenodd" d="M13.827 3.52h3.603L24 20h-3.603l-6.57-16.48zm-7.258 0h3.767L16.906 20h-3.674l-1.343-3.461H5.017l-1.344 3.46H0L6.57 3.522zm4.132 9.959L8.453 7.687 6.205 13.48H10.7z"/>
    </g>
    <text x="56" y="27" font-size="13" font-weight="600" fill="#f0f6fc">Claude</text>
    <text x="56" y="44" class="mono" font-size="11" fill="#8b949e">Desktop &amp; Code</text>
  </g>

  <!-- Codex / OpenAI -->
  <g transform="translate(0, 68)">
    <rect width="180" height="58" rx="8" fill="url(#grad-card)" stroke="#30363d"/>
    <!-- Official OpenAI / Codex Logo -->
    <g transform="translate(14, 16) scale(1.1)" fill="#10a37f">
      <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
    </g>
    <text x="56" y="27" font-size="13" font-weight="600" fill="#f0f6fc">Codex</text>
    <text x="56" y="44" class="mono" font-size="11" fill="#8b949e">Agents &amp; CLI</text>
  </g>

  <!-- Cursor -->
  <g transform="translate(0, 136)">
    <rect width="180" height="58" rx="8" fill="url(#grad-card)" stroke="#30363d"/>
    <!-- Official Cursor Logo -->
    <g transform="translate(14, 16) scale(0.05)" fill="#f0f6fc">
      <path d="M457.43 125.94 244.42 2.96a22.13 22.13 0 0 0-22.12 0L9.3 125.94C3.55 129.26 0 135.4 0 142.05v247.99c0 6.65 3.55 12.79 9.3 16.11l213.01 122.98a22.13 22.13 0 0 0 22.12 0l213.01-122.98c5.75-3.32 9.3-9.46 9.3-16.11V142.05c0-6.65-3.55-12.79-9.3-16.11zm-13.38 26.05L238.42 508.15c-1.39 2.4-5.06 1.42-5.06-1.36V273.58c0-4.66-2.49-8.97-6.53-11.31L24.87 145.67c-2.4-1.39-1.42-5.06 1.36-5.06h411.26c5.84 0 9.49 6.33 6.57 11.39h-.01Z"/>
    </g>
    <text x="56" y="27" font-size="13" font-weight="600" fill="#f0f6fc">Cursor</text>
    <text x="56" y="44" class="mono" font-size="11" fill="#8b949e">Editor / Agent</text>
  </g>

  <!-- Antigravity / Gemini -->
  <g transform="translate(0, 204)">
    <rect width="180" height="58" rx="8" fill="url(#grad-card)" stroke="#30363d"/>
    <!-- DeepMind / Google Sparkle -->
    <g transform="translate(14, 16)" fill="#4285f4">
      <path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"/>
    </g>
    <text x="56" y="27" font-size="13" font-weight="600" fill="#f0f6fc">Antigravity</text>
    <text x="56" y="44" class="mono" font-size="11" fill="#8b949e">Autonomous Agent</text>
  </g>

</g>

<!-- ================= CONNECTORS (WIRES) ================= -->
<g stroke="#30363d" stroke-width="1.5" fill="none">
  <path d="M 220 117 C 300 117, 300 217, 380 217" class="wire-in" stroke="#a48cf0"/>
  <path d="M 220 185 C 290 185, 300 217, 380 217" class="wire-in" stroke="#a48cf0"/>
  <path d="M 220 253 C 290 253, 300 217, 380 217" class="wire-in" stroke="#a48cf0"/>
  <path d="M 220 321 C 300 321, 300 217, 380 217" class="wire-in" stroke="#a48cf0"/>
</g>

<!-- Animated dots -->
<g fill="#a48cf0">
  <circle cx="220" cy="117" r="3.5" class="dot-l"/>
  <circle cx="220" cy="185" r="3.5" class="dot-l" style="animation-delay: 0.6s"/>
  <circle cx="220" cy="253" r="3.5" class="dot-l" style="animation-delay: 1.2s"/>
  <circle cx="220" cy="321" r="3.5" class="dot-l" style="animation-delay: 1.8s"/>
</g>

<!-- ================= MCP SERVER (MIDDLE) ================= -->
<g transform="translate(380, 118)">
  <rect width="200" height="198" rx="10" fill="#161b22" stroke="#7c65f6" stroke-width="1.5"/>

  <rect x="16" y="16" width="168" height="26" rx="4" fill="#21262d"/>
  <text x="100" y="33" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f0f6fc">omnia-sdk mcp</text>

  <g transform="translate(16, 56)">
    <text x="0" y="10" class="mono" font-size="10" fill="#8b949e">TRANSPORT</text>
    <text x="168" y="10" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#5fc59a">stdio</text>
    <line x1="0" y1="18" x2="168" y2="18" stroke="#30363d"/>
  </g>

  <!-- Exposed tools list -->
  <g transform="translate(16, 88)">
    <text x="0" y="0" class="mono" font-size="10" fill="#8b949e">TOOLS</text>
    <g transform="translate(0, 10)">
      <rect width="168" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="8" y="15" class="mono" font-size="11" fill="#e6edf3">inspect_slide()</text>
    </g>
    <g transform="translate(0, 38)">
      <rect width="168" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="8" y="15" class="mono" font-size="11" fill="#e6edf3">verify_slide_integrity()</text>
    </g>
    <g transform="translate(0, 66)">
      <rect width="168" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="8" y="15" class="mono" font-size="11" fill="#e6edf3">get_sdk_status()</text>
    </g>
  </g>
</g>

<!-- ================= OUTPUT WIRES ================= -->
<g stroke="#30363d" stroke-width="1.5" fill="none">
  <path d="M 580 185 C 640 185, 650 160, 710 160" class="wire-out" stroke="#5fc59a"/>
  <path d="M 580 250 C 640 250, 650 275, 710 275" class="wire-out" stroke="#5fc59a"/>
</g>

<g fill="#5fc59a">
  <circle cx="580" cy="185" r="3.5" class="dot-r"/>
  <circle cx="580" cy="250" r="3.5" class="dot-r" style="animation-delay: 0.8s"/>
</g>

<!-- ================= STORAGE / TARGET (RIGHT) ================= -->
<g transform="translate(710, 108)">

  <!-- .omnia file -->
  <g transform="translate(0, 0)">
    <rect width="210" height="98" rx="8" fill="#161b22" stroke="#5fc59a" stroke-width="1.5"/>
    <rect x="14" y="14" width="38" height="22" rx="4" fill="#5fc59a"/>
    <text x="33" y="29" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#0d1117">.omnia</text>
    <text x="60" y="26" font-size="13" font-weight="600" fill="#f0f6fc">Container</text>
    <text x="60" y="42" class="mono" font-size="10" fill="#8b949e">Zstd compressed</text>
    <line x1="14" y1="50" x2="196" y2="50" stroke="#30363d"/>
    <text x="14" y="68" class="mono" font-size="11" fill="#8b949e">CRC32 per tile block</text>
    <text x="14" y="84" class="mono" font-size="11" fill="#8b949e">Direct seek, zero copy</text>
  </g>

  <!-- Formats -->
  <g transform="translate(0, 114)">
    <rect width="210" height="92" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="26" font-size="13" font-weight="600" fill="#f0f6fc">Supported inputs</text>
    <text x="14" y="44" class="mono" font-size="11" fill="#8b949e">SVS, MRXS, SCN, NDPI</text>
    <line x1="14" y1="52" x2="196" y2="52" stroke="#30363d"/>
    <text x="14" y="70" class="mono" font-size="11" fill="#8b949e">DICOM series, NIfTI (.nii)</text>
  </g>

</g>

<!-- Bottom terminal command bar -->
<g transform="translate(40, 368)">
  <rect width="880" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="14" y="20" class="mono" font-size="11" fill="#8b949e">$ <tspan fill="#e6edf3">claude mcp add omnia-sdk uvx --from git+https://github.com/mishel-0/omnia-sdk.git mcp run mcp_server.py</tspan></text>
</g>

</svg>
