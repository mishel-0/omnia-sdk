[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-sdk"
version = "1.1.0"
description = "Medical image container for PyTorch training: whole-slide, DICOM and NIfTI to one fast, CRC-verified .omnia format, with reproducible benchmarks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mishel Adnan", email = "misheladnan35@gmail.com"}
]
keywords = ["pathology", "whole-slide", "svs", "openslide", "pytorch", "compression", "medical-imaging", "ai-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "zstandard>=0.21.0",
    "tifffile>=2024.0.0",
]

[project.optional-dependencies]
svs = ["openslide-python>=1.4.0", "Pillow>=10.0.0"]  # needed for .svs conversion + benchmark
dicom = ["pydicom>=2.4.0"]
dicom-wsi = ["pydicom>=2.4.0", "wsidicom>=0.20.0"]
nifti = ["nibabel>=5.0.0"]
all = ["openslide-python>=1.4.0", "Pillow>=10.0.0", "pydicom>=2.4.0", "wsidicom>=0.20.0", "nibabel>=5.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
omnia = "omnia_sdk.cli:main"
omnia-benchmark = "omnia_sdk.benchmark:main"

[project.urls]
Homepage = "https://github.com/mishel-0/omnia-sdk"
Documentation = "https://github.com/mishel-0/omnia-sdk#readme"
Repository = "https://github.com/mishel-0/omnia-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnia_sdk*"]

[tool.black]
line-length = 100
target-version = ["py311"]
