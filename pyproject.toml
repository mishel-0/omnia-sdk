[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-sdk"
version = "1.1.0"
description = "Medical image container for PyTorch training: whole-slide, DICOM and NIfTI to one fast, CRC-verified .omnia format, with reproducible benchmarks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mishel Adnan", email = "misheladnan35@gmail.com"}
]
keywords = ["pathology", "whole-slide", "svs", "openslide", "pytorch", "compression", "medical-imaging", "ai-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
# The core (convert, verify, info, OmniaContainer) needs no PyTorch, so converting
# files on a laptop stays a small install. Training and benchmarks pull torch in
# through the [train] / [benchmark] extras.
dependencies = [
    "numpy>=1.24.0",
    "zstandard>=0.21.0",
    "tifffile>=2024.0.0",
]

[project.optional-dependencies]
# openslide-bin ships the OpenSlide C library as a wheel (macOS, Windows, Linux): no Homebrew or DLL setup.
svs = ["openslide-python>=1.4.0", "openslide-bin>=4.0.0", "Pillow>=10.0.0"]
# pylibjpeg decoders handle JPEG / JPEG 2000 compressed DICOM.
dicom = ["pydicom>=2.4.0", "pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1", "pylibjpeg-openjpeg>=2.3"]
dicom-wsi = ["pydicom>=2.4.0", "wsidicom>=0.20.0", "pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1", "pylibjpeg-openjpeg>=2.3"]
nifti = ["nibabel>=5.0.0"]
# Every format reader. Still no PyTorch: add [train] to load .omnia files into a model.
all = ["openslide-python>=1.4.0", "openslide-bin>=4.0.0", "Pillow>=10.0.0", "pydicom>=2.4.0", "wsidicom>=0.20.0",
       "pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1", "pylibjpeg-openjpeg>=2.3", "nibabel>=5.0.0"]
train = ["torch>=2.0.0"]
benchmark = ["torch>=2.0.0", "torchvision>=0.15.0"]
mlarray = ["mlarray>=0.0.54"]
dev = ["pytest>=7.0.0"]

[project.scripts]
omnia = "omnia_sdk.cli:main"
omnia-benchmark = "omnia_sdk.benchmark:main"

[project.urls]
Homepage = "https://github.com/mishel-0/omnia-sdk"
Documentation = "https://github.com/mishel-0/omnia-sdk#readme"
Repository = "https://github.com/mishel-0/omnia-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnia_sdk*"]

[tool.black]
line-length = 100
target-version = ["py311"]
